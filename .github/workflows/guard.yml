name: Guard

# The PR guard (scripts/guard/check.mjs): no telemetry, analytics, ads or crash reporting SDK; no em or en dash in the
# app's copy; both locales with the same keys and placeholders; and no line added to docs/ or a top-level Markdown file
# that matches a pattern in scripts/guard/patterns.txt (quotes and narration of what someone said, transcripts and run
# logs, personal data, local paths and secrets). Everything in that file is public, so it may only hold patterns that
# are safe to publish.
#
# Plain Node with no dependencies, so there is no install step. GitHub-hosted runner, `pull_request` trigger,
# read-only token, no secrets.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: PR guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The guard compares the pull request with its base, so it needs the history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The guard's own tests
        run: node --test scripts/guard/check.test.mjs
      - name: Check the pull request against its base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/guard/check.mjs --base "$BASE_SHA" --patterns scripts/guard/patterns.txt
