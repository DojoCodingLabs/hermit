name: Device report

# Issue ops for the Device lab (docs/devices.md). A device report filed with the issue form is checked against
# docs/devices/schema.json and the privacy rules; when it passes, it goes into data/devices and the device table on the
# device-data branch, through a pull request a maintainer merges, and the issue gets a thank-you with the link. When
# it doesn't, a comment says what is wrong, and editing the issue runs the check again.
#
# Nothing from the issue is ever run. scripts/devices/validate.mjs reads the issue from the event file as data and
# parses the report with JSON.parse; the issue's text never goes into a command. The only value from the event that
# reaches a shell is the issue number. The scripts come from the default branch's checkout, and the token can write
# only where a job needs it: issues to comment, and contents and pull requests in the job that records the report.
#
# The device-lab label also marks issues that need a real phone; one without the form's Report field is skipped.
# Runs for different issues may overlap: scripts/devices/record.mjs retries a push that loses the race.
on:
  issues:
    types: [opened, edited]

permissions: {}

concurrency:
  # Edits to one issue run in order, and a newer edit replaces one still waiting.
  group: device-report-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the report
    if: github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'device-lab')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # say what is wrong
    outputs:
      valid: ${{ steps.check.outputs.valid }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check the report against the schema and the privacy rules
        id: check
        run: node scripts/devices/validate.mjs --event "$GITHUB_EVENT_PATH" --github-output "$GITHUB_OUTPUT" --comment "$RUNNER_TEMP/comment.md"
      - name: Say what is wrong
        if: steps.check.outputs.valid != 'true' && steps.check.outputs.form == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"

  record:
    name: Add it to the device table
    needs: check
    if: needs.check.outputs.valid == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the device-data branch
      pull-requests: write # open or update its pull request
      issues: write # thank the reporter, with the link
    steps:
      # The default branch, with credentials kept for the push. Nothing from the issue is checked out.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Write the report and the table on the device-data branch, and open or update its pull request
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          BASE: ${{ github.event.repository.default_branch }}
        run: node scripts/devices/record.mjs
      - name: Thank the reporter
        # Nothing changed (an edit to the notes, or the same report again): nothing to say.
        if: steps.record.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.record.outputs.url }}
        run: |
          printf '%s\n\n%s\n' \
            "Thanks for running the Device lab. Your report passed the checks and is in $PR_URL, which adds it to the device table in docs/devices.md once a maintainer merges it." \
            "This issue closes when that pull request is merged." > "$RUNNER_TEMP/thanks.md"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/thanks.md"
