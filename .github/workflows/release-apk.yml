name: Release APK

# The preview APK (docs/devices.md): a release build with the app's code inside, signed with the preview key kept in
# this repository's secrets, attached to the GitHub Release with its SHA-256 and its signing certificate's. The model
# isn't in the APK: on first run the app downloads it once and checks it against the SHA-256 pinned in the code.
#
# Runs when a v* tag is pushed, or by hand from an existing tag to build it again. It never makes the tag: a maintainer
# pushes it (CONTRIBUTING.md, For maintainers), so the last step only attaches. Never on a pull request: no fork's
# code ever runs where the key is. GitHub-hosted runner only. The key is written to the runner's temp folder for the
# build and deleted after it, whatever happens.
#
# Secrets: HERMIT_PREVIEW_KEYSTORE_B64 (the keystore, base64), HERMIT_PREVIEW_KEYSTORE_PASSWORD,
# HERMIT_PREVIEW_KEY_ALIAS, HERMIT_PREVIEW_KEY_PASSWORD. apps/mobile/plugins/with-release-signing.js reads them at
# build time; nothing about the key is in the repository.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to build again, like v0.1.0-preview.1. Run the workflow from that tag."
        required: true
        type: string

permissions: {}

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  apk:
    name: Build, sign and attach the APK
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write # create the release and attach the APK
    env:
      NDK_VERSION: "29.0.14206865"
    steps:
      - name: The tag and the version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,4}(-[0-9A-Za-z.]{1,24})?$ ]]; then
            echo "::error::The tag must look like v0.1.0 or v0.1.0-preview.1."
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            # A hyphen marks a pre-release (v0.1.0-preview.1).
            if [[ "$tag" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi
          } >> "$GITHUB_OUTPUT"
      # The hosted image ships toolchains this build never uses. The NDK, the native modules' CMake builds and
      # Gradle's caches need the room.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
      - name: Runner resources
        run: |
          nproc
          free -h
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: The tag must exist and point at this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          at=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | awk '{print $1}' | tail -n 1)
          if [ -z "$at" ]; then
            echo "::error::There is no tag $TAG. A release starts from a pushed tag (CONTRIBUTING.md, For maintainers)."
            exit 1
          fi
          if [ "$at" != "$GITHUB_SHA" ]; then
            echo "::error::The tag $TAG points at another commit. Run this workflow from the tag."
            exit 1
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK pieces (platform 37, the NDK QVAC pins, CMake)
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 ndk;${{ env.NDK_VERSION }} cmake;3.22.1"
          log-accepted-android-sdk-licenses: false
      - run: pnpm install --frozen-lockfile
      - name: The app's version from the tag (versionName), and this run's number as its versionCode
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ github.run_number }}
        run: |
          node -e '
            const fs = require("node:fs");
            const path = "apps/mobile/app.json";
            const app = JSON.parse(fs.readFileSync(path, "utf8"));
            app.expo.version = process.env.VERSION;
            app.expo.android.versionCode = Number(process.env.CODE);
            fs.writeFileSync(path, JSON.stringify(app, null, 2) + "\n");
          '
      - name: Expo prebuild (QVAC bundles and links its worker; the signing plugin wires the release key)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Rebuild the QVAC worker bundle from the workspace root (pnpm monorepo paths)
        run: node scripts/qvac-bundle.mjs
      - name: Wallet worklet bundle and addons again, last before Gradle (it only adds to bare-kit's addon folder)
        run: node apps/mobile/worklets/wallet/build.mjs
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: gradle-
      # The wrapper gives services.gradle.org 10 seconds by default, and a slow answer used to end the whole build.
      - name: Fetch Gradle, trying again when the download times out
        working-directory: apps/mobile/android
        run: |
          props=gradle/wrapper/gradle-wrapper.properties
          if grep -q '^networkTimeout=' "$props"; then
            sed -i 's/^networkTimeout=.*/networkTimeout=60000/' "$props"
          else
            echo 'networkTimeout=60000' >> "$props"
          fi
          for try in 1 2 3; do
            if ./gradlew --version --no-daemon > /dev/null; then exit 0; fi
            echo "::warning::Fetching Gradle failed (try $try of 3)."
            sleep 30
          done
          echo "::error::Couldn't fetch Gradle from services.gradle.org."
          exit 1
      - name: The preview key, from the repository's secrets
        env:
          KEYSTORE_B64: ${{ secrets.HERMIT_PREVIEW_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::The HERMIT_PREVIEW_KEYSTORE_B64 secret isn't set."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/preview.jks"
      - name: Build the release APK (the JS bundle inside, signed with the preview key)
        working-directory: apps/mobile/android
        env:
          HERMIT_RELEASE_STORE_FILE: ${{ runner.temp }}/preview.jks
          HERMIT_RELEASE_STORE_PASSWORD: ${{ secrets.HERMIT_PREVIEW_KEYSTORE_PASSWORD }}
          HERMIT_RELEASE_KEY_ALIAS: ${{ secrets.HERMIT_PREVIEW_KEY_ALIAS }}
          HERMIT_RELEASE_KEY_PASSWORD: ${{ secrets.HERMIT_PREVIEW_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
      - name: Check it is signed with the preview key, and name it
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
          STORE_PASSWORD: ${{ secrets.HERMIT_PREVIEW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HERMIT_PREVIEW_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/hermit-$VERSION.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          signer=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          key=$(keytool -list -v -keystore "$RUNNER_TEMP/preview.jks" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" | grep -m1 'SHA256:' | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$signer" ] || [ "$signer" != "$key" ]; then
            echo "::error::The APK isn't signed with the preview key."
            exit 1
          fi
          {
            echo "path=$apk"
            echo "sha256=$(sha256sum "$apk" | awk '{print $1}')"
            echo "cert=$signer"
            echo "bytes=$(stat -c %s "$apk")"
          } >> "$GITHUB_OUTPUT"
      - name: Attach it to the release, with its SHA-256 in the notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          APK: ${{ steps.apk.outputs.path }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
          CERT: ${{ steps.apk.outputs.cert }}
          BYTES: ${{ steps.apk.outputs.bytes }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          {
            printf 'Hermit %s: a preview build to try Hermit on your phone and run the Device lab.\n\n' "$VERSION"
            printf -- '- **hermit-%s.apk**, %s bytes\n' "$VERSION" "$BYTES"
            printf -- "- SHA-256: \`%s\`\n" "$SHA256"
            printf -- "- Signing certificate SHA-256: \`%s\`\n\n" "$CERT"
            printf 'How to install it, check it and run the Device lab: https://github.com/%s/blob/main/docs/devices.md\n\n' "$GITHUB_REPOSITORY"
            printf "The model isn't in the APK. On first run Hermit downloads it once (about 530 MB) and checks it against its pinned SHA-256.\n"
          } > "$notes"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          else
            flags=()
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Hermit $VERSION (preview)" --notes-file "$notes" "${flags[@]}"
          fi
      - name: Delete the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/preview.jks"
