plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.dojocoding.hermit.notifications'
version = '0.1.0'

android {
  namespace "io.dojocoding.hermit.notifications"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.13.1"
  // The allowed-cores parsing runs on the JVM (CpuAffinityTest).
  testImplementation "junit:junit:4.13.2"
}
